name: Verified LoL refresh and Pages

on:
  schedule:
    - cron: "17 */4 * * *" # Best-effort four-hour full-inventory refresh.
  workflow_dispatch:
  push:
    branches: [main, arena/d126dc4d-lolhotspawn4]

permissions:
  contents: read

concurrency:
  group: verified-lol-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Generated preview receipts are already tested before the bot commit.
    if: "github.event_name != 'push' || (!startsWith(github.event.head_commit.message, 'verified data:') && !startsWith(github.event.head_commit.message, 'verified evidence:'))"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Bot may write ONLY the fixed Arena preview branch below.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore dated last-good source receipts, never their timestamps
        uses: actions/cache@v4
        with:
          path: |
            verified/data/source-cache.json
            verified/data/history.json
          key: verified-receipts-v1-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: verified-receipts-v1-${{ github.ref_name }}-
      - name: Unit safety gates (no network)
        run: |
          python -m unittest discover -s verified_pipeline/tests -p 'test_core.py' -v
          python -m unittest discover -s verified_pipeline/tests -p 'test_sources.py' -v
          python -m unittest discover -s verified_pipeline/tests -p 'test_wiki.py' -v
      - name: Full inventory and original-publisher refresh
        shell: bash
        run: |
          set -euo pipefail
          python -m verified_pipeline.refresh 2>&1 | tee "$RUNNER_TEMP/verified-refresh.log"
          {
            echo '## Verified-only refresh'
            echo 'Unsupported values remain null. Source restrictions do not become invented prices.'
            cat verified/data/integrity.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Reproduce every published inventory row and calculation; check all internal links
        run: |
          python -m unittest discover -s verified_pipeline/tests -p 'test_*.py' -v
          python -m verified_pipeline.check --out "$RUNNER_TEMP/verified-static.json"
      - name: Install pinned, isolated browser acceptance tools
        run: npm install --prefix "$RUNNER_TEMP/verified-ui" --no-fund --no-audit playwright-core@1.64.1 @sparticuz/chromium@153.0.0 axe-core@4.14.0
      - name: Real mobile browser, accessibility, filters, source links and expiry gates
        run: node verified_pipeline/browser_test.mjs --tools "$RUNNER_TEMP/verified-ui" --out "$RUNNER_TEMP/verified-browser.json"
      - name: Preserve tested preview receipts only on the fixed Arena branch
        if: github.ref == 'refs/heads/arena/d126dc4d-lolhotspawn4'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Verified source refresh"
          git config user.email "actions@users.noreply.github.com"
          git add verified/data verified/*.html verified/.nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "verified data: retain tested original-source refresh"
            git pull --rebase=merges origin arena/d126dc4d-lolhotspawn4
            git push origin arena/d126dc4d-lolhotspawn4
          fi
      - name: Upload independent acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-acceptance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/verified-static.json
            ${{ runner.temp }}/verified-browser*.json
            ${{ runner.temp }}/verified-refresh.log
            verified/data/deployment.json
            verified/data/integrity.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload ONLY the verified public site (never the repository root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: verified

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Public acceptance receipts may push ONLY the fixed Arena branch.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: verified-pages-production
      cancel-in-progress: false
    steps:
      - name: Select Actions publication for the existing Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api --method PUT "repos/${{ github.repository }}/pages" -f build_type=workflow > "$RUNNER_TEMP/pages-settings-attempt.json" 2> "$RUNNER_TEMP/pages-settings-attempt.txt"; then
            echo 'Existing Pages setting updated.'
          else
            echo '::warning::Pages settings update was denied/failed. It is NOT marked successful. Trying the separate, standard authorized Pages deployment API next; public run/commit acceptance is still mandatory.'
            cat "$RUNNER_TEMP/pages-settings-attempt.txt"
          fi
          gh api "repos/${{ github.repository }}/pages" --jq '{build_type,source,status,html_url}' > "$RUNNER_TEMP/verified-public-settings.json"
          cat "$RUNNER_TEMP/verified-public-settings.json"
      - name: Deploy the tested verified-only artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify actual public artifact, expected run/commit, populated inventory and all internal links
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: python -m verified_pipeline.public_check --url "$PUBLIC_URL" --run "${{ github.run_id }}" --commit "${{ github.sha }}" --out "$RUNNER_TEMP/verified-public.json"
      - name: Install isolated public-browser acceptance tools
        run: npm install --prefix "$RUNNER_TEMP/verified-ui" --no-fund --no-audit playwright-core@1.64.1 @sparticuz/chromium@153.0.0 axe-core@4.14.0
      - name: Run the mobile and functional gate against the actual public Pages URL
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: node verified_pipeline/browser_test.mjs --url "$PUBLIC_URL" --expected-run "${{ github.run_id }}" --tools "$RUNNER_TEMP/verified-ui" --out "$RUNNER_TEMP/verified-public-browser.json"
      - name: Preserve public deployment acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-public-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/verified-public*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Retain public acceptance receipts only on the fixed Arena branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Verified public acceptance"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin arena/d126dc4d-lolhotspawn4
          git switch --force-create arena/d126dc4d-lolhotspawn4 origin/arena/d126dc4d-lolhotspawn4
          mkdir -p audit/d126dc4d
          cp "$RUNNER_TEMP"/verified-public*.json audit/d126dc4d/
          git add audit/d126dc4d/verified-public*.json
          if ! git diff --cached --quiet; then
            git commit -m "verified evidence: retain actual public Pages acceptance"
            git pull --rebase=merges origin arena/d126dc4d-lolhotspawn4
            git push origin arena/d126dc4d-lolhotspawn4
          fi
