name: refresh

# Refreshes the LoL Hotspawn pick dataset (match list + external lines) and
# commits it back to the branch it runs on. GitHub Pages serves main, so the
# published site updates automatically after each successful run.
#
# Schedule: every 4 hours (within the required 4-8 hour window).
# Manual:   gh workflow run refresh.yml --ref <branch>

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
  # Pushes to main (e.g., integration merges) refresh immediately. Bot commits
  # from this workflow are excluded by the job-level `if` below to prevent a
  # commit -> push -> run -> commit loop.
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: "github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'data: refresh')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch sources and build dataset
        run: |
          # Run each collector step, mirroring output to the job step summary.
          # On failure, re-emit the tail as error annotations so the traceback
          # is retrievable via the checks API even if the log endpoint is down.
          set +e
          {
            echo '## fetch_hotspawn'
            python collector/fetch_hotspawn.py || echo "FAILED_WITH_EXIT_$?"
            echo '## fetch_odds'
            python collector/fetch_odds.py || echo "FAILED_WITH_EXIT_$?"
            echo '## build'
            python collector/build.py || echo "FAILED_WITH_EXIT_$?"
          } 2>&1 | tee "$GITHUB_STEP_SUMMARY"
          if grep -q "FAILED_WITH_EXIT_" "$GITHUB_STEP_SUMMARY"; then
            echo "::error::collector failed; traceback tail attached as annotations"
            tail -25 "$GITHUB_STEP_SUMMARY" | while IFS= read -r line; do
              echo "::error file=collector/detail.txt::${line}"
            done
            exit 1
          fi

      - name: Upload raw audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/polymarket_lol_events_full.json
            data/raw/manifest.json
          if-no-files-found: ignore

      - name: Commit updated data
        run: |
          git config user.name "LOL Hotspawn pick desk"
          git config user.email "pickdesk@users.noreply.github.com"
          if git status --porcelain -- data | grep -q .; then
            git add data
            git commit -m "data: refresh LoL Hotspawn picks at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          else
            echo "No data changes; nothing to commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
